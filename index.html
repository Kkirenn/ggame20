<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>2048 ASMR</title>
<style>
:root{--fg:#6b5a66;--cell:#f6eef1;--btn:#a8d8cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;background:#fbeef0 linear-gradient(160deg,#fdeef1 0%,#eef8f2 45%,#e6f2fb 100%) fixed;color:var(--fg);font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:14px}
body>*:not(#bg):not(#toast){position:relative;z-index:1}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bub{position:absolute;bottom:-140px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.2) 35%,rgba(190,225,255,.22) 62%,rgba(255,205,230,.3));border:1px solid rgba(255,255,255,.75);animation:fl linear infinite}
@keyframes fl{to{transform:translate(30px,-125vh)}}
@media (prefers-reduced-motion:reduce){.bub{animation:none;display:none}}
.top{width:min(92vw,440px);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:6px}
h1{margin:0;font-size:32px;color:#7d6a78;font-weight:600}
.sc{display:flex;gap:6px}.sc div{background:rgba(255,255,255,.65);padding:4px 10px;border-radius:12px;text-align:center;font-size:11px}.sc b{display:block;font-size:17px}
button{background:var(--btn);color:#3d5c56;border:0;border-radius:14px;padding:8px 12px;font-size:14px;cursor:pointer;box-shadow:inset 0 2px 4px rgba(255,255,255,.7),0 3px 8px rgba(150,130,150,.18)}button:disabled{opacity:.5;cursor:default}
#undo{background:#f7cdb9;color:#6a4a40;margin-top:12px}
#board{position:relative;width:min(92vw,440px);aspect-ratio:1;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 12px 30px rgba(180,150,180,.22),inset 0 2px 8px rgba(255,255,255,.8);backdrop-filter:blur(8px)}
.cell{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);background:var(--cell);border-radius:24%;box-shadow:inset 0 3px 6px rgba(160,130,150,.18)}
.t{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);transition:transform .11s cubic-bezier(.3,.8,.4,1)}
.f{position:absolute;inset:0;border-radius:24%;overflow:hidden;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.85),rgba(255,255,255,0) 48%),linear-gradient(150deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:inset 0 4px 8px rgba(255,255,255,.7),inset 0 -6px 10px rgba(150,120,140,.16),0 6px 12px rgba(150,120,140,.2)}
.f svg{position:absolute;inset:0;width:100%;height:100%}
.n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.38);font-weight:700;color:#6b5560;text-shadow:0 1px 0 rgba(255,255,255,.7)}.n.s{font-size:calc(var(--cs)*.3)}
.cr path{fill:none;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:dr .4s .05s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pop{animation:pop .3s}.sp{animation:sp .22s}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes sp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
#msg{position:absolute;inset:0;z-index:9;background:rgba(255,248,250,.78);backdrop-filter:blur(4px);color:#6b5560;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:600;border-radius:26px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(110,90,105,.92);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;display:none;text-align:center;max-width:90vw}
p{font-size:13px;opacity:.7;margin:12px 0;text-align:center}
</style></head><body>

function ac(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=12000;const cm=AC.createDynamicsCompressor();

 for(const k in AUD)[].concat(AUD[k]).forEach((s,i)=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);AC.decodeAudioData(u.buffer,b=>{(B[k]=B[k]||[])[i]=b},()=>{})})}catch(e){}return AC}

 if(k=='sw')play('k',.45,R(.95,1.05));

function burst(x,y,col,n){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(1.5,5.5);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,r:R(0,6),vr:R(-.3,.3),z:R(4,11),col,life:1,sh:1})}
 for(let i=0;i<8;i++)P.push({x:x+R(-20,20),y:y+R(-10,20),vx:R(-.6,.6),vy:-R(.4,1.4),z:R(3,8),col:'rgba(255,255,255,.8)',life:1,sh:0});if(!raf)raf=requestAnimationFrame(loop)}
function loop(){cx.clearRect(0,0,board.clientWidth,board.clientHeight);P=P.filter(p=>p.life>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.life-=p.sh?.022:.014;cx.globalAlpha=Math.max(p.life,0);
  if(p.sh){p.vy+=.25;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.col;cx.beginPath();cx.moveTo(0,-p.z);cx.lineTo(p.z*.8,p.z*.6);cx.lineTo(-p.z*.8,p.z*.6);cx.fill();cx.restore()}
  else{cx.strokeStyle=p.col;cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,p.z,0,6.28);cx.stroke()}}
 cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}

function crackD(l){let d='';const n=Math.min(1+(l>>1),5);
 for(let i=0;i<n;i++){const s=Math.random()*4|0,u=R(15,85);let x=s<2?u:s==2?2:98,y=s<2?(s?98:2):u,a=Math.atan2(50-y,50-x)+R(-.8,.8);d+='M'+x.toFixed(1)+' '+y.toFixed(1);
  for(let k=0,q=3+(Math.random()*3|0);k<q;k++){a+=R(-.7,.7);const L=R(8,17);x+=Math.cos(a)*L;y+=Math.sin(a)*L;d+='L'+x.toFixed(1)+' '+y.toFixed(1);
   if(Math.random()<.35){const b=a+R(-1.2,1.2);d+='l'+(Math.cos(b)*9).toFixed(1)+' '+(Math.sin(b)*9).toFixed(1)+'M'+x.toFixed(1)+' '+y.toFixed(1)}}}return d}

function init(){tiles.forEach(t=>t.el&&t.el.remove());tiles=[];rebuild();score=0;won=false;shownWin=false;prev=null;lock=false;m.style.display='none';add();add();hud()}
function add(){const e=[];grid.forEach((r,i)=>r.forEach((c,j)=>{if(!c)e.push([i,j])}));if(!e.length)return;const[r,c]=e[Math.random()*e.length|0],t={v:Math.random()<.9?2:4,r,c};grid[r][c]=t;tiles.push(t);mk(t,'sp');snd('sp')}
function hud(){$('s').textContent=score;if(score>best){best=score;try{localStorage.setItem('b2048',best)}catch(e){}saveBest()}$('b').textContent=best;$('undo').disabled=!prev}
function move(d){if(lock||adBusy)return;const snap=JSON.stringify({s:score,t:tiles.map(t=>[t.v,t.r,t.c])});let moved=false;const mg=[];
 for(let i=0;i<4;i++){const L=line(d,i),vs=L.map(([r,c])=>grid[r][c]).filter(Boolean),out=[];
  for(const t of vs){const q=out[out.length-1];if(q&&!q.b&&q.a.v==t.v)q.b=t;else out.push({a:t,b:null})}
  out.forEach((q,k)=>{const[r,c]=L[k];[q.a,q.b].forEach(t=>{if(t&&(t.r!=r||t.c!=c)){moved=true;t.r=r;t.c=c;pos(t)}});if(q.b){moved=true;mg.push({a:q.a,b:q.b,r,c})}})}
 if(!moved)return;prev=snap;
 const dead=new Set();mg.forEach(q=>{dead.add(q.a);dead.add(q.b)});tiles=tiles.filter(t=>!dead.has(t));
 const nn=mg.map(q=>{const n={v:q.a.v*2,r:q.r,c:q.c};score+=n.v;if(n.v==2048)won=true;return n});
 rebuild();nn.forEach(n=>grid[n.r][n.c]=n);snd('sw');lock=true;
 setTimeout(()=>{mg.forEach((q,i)=>{q.a.el.remove();q.b.el.remove();const n=nn[i],l=Math.log2(n.v);tiles.push(n);mk(n,'pop');
   burst(G+n.c*(CS+G)+CS/2,G+n.r*(CS+G)+CS/2,colr(l),12+l*2);snd('mg',l);try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}});
  add();hud();lock=false;endCheck()},125)}
function over(){for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(!grid[i][j])return false;const v=grid[i][j].v;if(i<3&&grid[i+1][j]&&grid[i+1][j].v==v)return false;if(j<3&&grid[i][j+1]&&grid[i][j+1].v==v)return false}return true}
function endCheck(){if(won&&!shownWin){shownWin=true;snd('win');show('Победа!','Дальше')}else if(over()){snd('go');show('Игра окончена','Заново')}}
function show(t,b){m.style.display='flex';m.innerHTML='<div>'+t+'</div>';const x=document.createElement('button');x.textContent=b;x.onclick=()=>{b=='Дальше'?m.style.display='none':newGame()};m.append(x)}
const MOB=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
$('hint').textContent=MOB?'Свайпай по экрану, чтобы двигать кубики. Лучше в наушниках':'Стрелки на клавиатуре или свайп мышью. Лучше в наушниках';
if(!MOB)addEventListener('keydown',e=>{const d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!=null){e.preventDefault();move(d)}});
let sx=null,sy=0;
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))});
addEventListener('pointercancel',()=>sx=null);
/* ===== VK Bridge + реклама ===== */
const bridge=window.vkBridge;let inVK=false,adBusy=false,lastAd=Date.now(),saveT;
const AD_COOLDOWN=120000; // interstitial: не чаще раза в 2 минуты и не в первые 2 минуты
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
if(bridge){bridge.send('VKWebAppInit').then(()=>{inVK=true;loadBest()}).catch(()=>{});
 bridge.subscribe(e=>{const t=e.detail&&e.detail.type;if(t=='VKWebAppViewHide')pauseAudio(true);if(t=='VKWebAppViewRestore')pauseAudio(false)})}
function loadBest(){bridge.send('VKWebAppStorageGet',{keys:['best']}).then(r=>{const k=(r.keys||[]).find(x=>x.key=='best'),v=k?+k.value:0;if(v>best){best=v;$('b').textContent=best}}).catch(()=>{})}
function saveBest(){if(!inVK)return;clearTimeout(saveT);saveT=setTimeout(()=>bridge.send('VKWebAppStorageSet',{key:'best',value:String(best)}).catch(()=>{}),2000)}
async function inter(){if(!inVK||adBusy||Date.now()-lastAd<AD_COOLDOWN)return;
 try{const c=await bridge.send('VKWebAppCheckNativeAds',{ad_format:'interstitial'});if(!c.result)return;
  adBusy=true;pauseAudio(true);await bridge.send('VKWebAppShowNativeAds',{ad_format:'interstitial'});lastAd=Date.now()}
 catch(e){}finally{adBusy=false;pauseAudio(false)}}
async function reward(){if(adBusy)return false;if(!inVK){toast('Реклама доступна только во ВКонтакте');return false}
 try{const c=await bridge.send('VKWebAppCheckNativeAds',{ad_format:'reward',use_waterfall:false});if(!c.result){toast('Сейчас нет доступной рекламы, попробуй позже');return false}
  adBusy=true;pauseAudio(true);const r=await bridge.send('VKWebAppShowNativeAds',{ad_format:'reward',use_waterfall:false});lastAd=Date.now();return !!(r&&r.result)}
 catch(e){return false}finally{adBusy=false;pauseAudio(false)}}
function newGame(){inter();init()}
async function undoAd(){if(!prev||adBusy)return;
 if(await reward()){if(!prev)return;const s=JSON.parse(prev);tiles.forEach(t=>t.el&&t.el.remove());tiles=s.t.map(([v,r,c])=>({v,r,c}));rebuild();tiles.forEach(t=>mk(t));score=s.s;prev=null;lock=false;m.style.display='none';hud()}}
/* ===== старт ===== */
for(let i=0;i<9;i++){const b=document.createElement('div'),z=R(30,90);b.className='bub';b.style.cssText='width:'+z+'px;height:'+z+'px;left:'+R(0,95)+'%;animation-duration:'+R(22,40)+'s;animation-delay:-'+R(0,30)+'s';$('bg').append(b)}
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='cell';board.append(c);cells.push(c)}
cv=document.createElement('canvas');cv.id='fx';board.append(cv);cx=cv.getContext('2d');
m=document.createElement('div');m.id='msg';board.append(m);
$('mu').textContent=muted?'Звук: выкл':'Звук: вкл';addEventListener('resize',layout);layout();init();
</script></body></html>
